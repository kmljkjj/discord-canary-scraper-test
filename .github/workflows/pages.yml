name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/experiments.json'
      - 'data/findings.json'
      - 'data/routes.json'
      - 'data/build.json'
      - 'data/last_run_meta.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Sync experiments into docs
        run: |
          mkdir -p docs/data
          if [ -f data/experiments.json ]; then
            cp data/experiments.json docs/data/experiments.json
            cp data/experiments.json docs/data/findings.json
            echo "Synced experiments.json"
          elif [ -f data/findings.json ]; then
            cp data/findings.json docs/data/findings.json
            cp data/findings.json docs/data/experiments.json
            echo "Synced findings.json"
          else
            echo '{"experiments":[],"scrapedAt":null}' > docs/data/experiments.json
            cp docs/data/experiments.json docs/data/findings.json
            echo "Placeholder experiments.json"
          fi
          for f in routes build last_run_meta; do
            if [ -f "data/$f.json" ]; then cp "data/$f.json" "docs/data/$f.json"; fi
          done

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Pages not enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages not configured. Enable: Settings → Pages → Source: GitHub Actions"
          exit 0

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
