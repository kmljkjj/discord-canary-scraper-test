name: Discord Shop

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-shop]

permissions:
  contents: write

concurrency:
  group: discord-shop
  cancel-in-progress: false

jobs:
  shop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Track shop items
        id: shop
        env:
          SHOP_WEBHOOK_URL: ${{ secrets.SHOP_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          ORBIT_BOT_NAME: Datamining
          ORBIT_AVATAR_URL: ${{ vars.ORBIT_AVATAR_URL || format('https://cdn.jsdelivr.net/gh/{0}@main/media/datamining-avatar.png', github.repository) }}
        run: node src/shop.js

      - name: Save shop state
        if: always() && steps.shop.outcome != 'cancelled'
        env:
          COMMIT_SOFT_FAIL: '1'
        run: |
          scripts/commit-state.sh "shop: state" data/shop_items.json

      - name: Fail if shop step failed
        if: always() && steps.shop.outcome == 'failure'
        run: exit 1
