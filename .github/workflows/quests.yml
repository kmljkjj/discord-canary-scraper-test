name: Discord Quests

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-quests]

permissions:
  contents: write

concurrency:
  group: discord-quests
  cancel-in-progress: false

jobs:
  quests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Guard quests.js not corrupted
        run: |
          set -euo pipefail
          SZ=$(wc -c < src/quests.js)
          echo "quests.js size=$SZ"
          if [ "$SZ" -lt 15000 ] || grep -q PLACEHOLDER src/quests.js; then
            echo "FATAL: src/quests.js corrupted on main"
            exit 1
          fi
          node --check src/quests.js
          echo "Known ids sample:"
          python3 -c "import json;d=json.load(open('data/quests.json'));print('ids',len(d.get('ids')or[]))"

      - name: Track Discord quests
        id: quests
        env:
          QUEST_WEBHOOK_URL: ${{ secrets.QUEST_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKENS: ${{ secrets.DISCORD_USER_TOKENS }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          DISCORD_USER_TOKEN_4: ${{ secrets.DISCORD_USER_TOKEN_4 }}
          DISCORD_USER_TOKEN_5: ${{ secrets.DISCORD_USER_TOKEN_5 }}
          ORBIT_BOT_NAME: Datamining
        run: node src/quests.js

      - name: Save quest state
        if: always() && steps.quests.outcome != 'cancelled'
        run: |
          set -euo pipefail
          if [ ! -f data/quests.json ]; then
            echo "no quests.json"
            exit 0
          fi

          python3 - << 'PY'
          import json
          from pathlib import Path
          p = Path('data/quests.json')
          d = json.loads(p.read_text())
          ids = [str(x) for x in (d.get('ids') or [])]
          # hard-mark already announced spam set
          for x in [
            '1539421708417765386','1549171029241233449','1551999809626439731',
            '1552002448975994942','1552010656952356925','1550379237335367680',
          ]:
            if x not in ids:
              ids.append(x)
          d['ids'] = list(dict.fromkeys(ids))
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          print('state ids', len(d['ids']))
          PY

          scripts/commit-state.sh "quests: state" data/quests.json

      - name: Fail if quests scraper failed
        if: always() && steps.quests.outcome == 'failure'
        run: exit 1
