name: Blog + Zendesk Tracker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-blog, trigger-scraping]

permissions:
  contents: write

concurrency:
  group: blog-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Heal blog_tracker.js if PLACEHOLDER / too small
        run: |
          set -euo pipefail
          SZ=$(wc -c < src/blog_tracker.js 2>/dev/null || echo 0)
          echo "blog_tracker.js size=$SZ"
          if [ "$SZ" -lt 5000 ] || grep -q 'PLACEHOLDER' src/blog_tracker.js 2>/dev/null || grep -q 'WILL_LOAD' src/blog_tracker.js 2>/dev/null || grep -q '^LOADING$' src/blog_tracker.js 2>/dev/null; then
            echo "CORRUPTED — restoring from kmljkjj/discord-canary-scraper@main"
            curl -fsSL "https://raw.githubusercontent.com/kmljkjj/discord-canary-scraper/main/src/blog_tracker.js" -o src/blog_tracker.js
            # Fix HTML entities if raw delivery decoded them
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/blog_tracker.js')
          c = p.read_text()
          c2 = re.sub(
              r"\.replace\(/&nbsp;/g, ' '\)\s*\n\s*\.replace\(/&/g, '&'\)\s*\n\s*\.replace\(/</g, '<'\)\s*\n\s*\.replace\(/>/g, '>'\)\s*\n\s*\.replace\(/\"/g, '\"'\)",
              ".replace(/&nbsp;/g, ' ')\n    .replace(/&/g, '&')\n    .replace(/</g, '<')\n    .replace(/>/g, '>')\n    .replace(/"/g, '\"')",
              c,
              count=1,
          )
          p.write_text(c2)
          print('restored', len(c2))
          PY
            node --check src/blog_tracker.js
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/blog_tracker.js
            if ! git diff --staged --quiet; then
              git commit -m "fix(blog): restore blog_tracker.js from production" || true
              git pull --rebase --autostash origin main || git rebase --abort || true
              git push origin HEAD:main || true
            fi
          fi

      - name: Track blog + Zendesk
        id: track
        env:
          BLOG_WEBHOOK_URL: ${{ secrets.BLOG_WEBHOOK_URL }}
          ZENDESK_WEBHOOK_URL: ${{ secrets.ZENDESK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ORBIT_BOT_NAME: Datamining
        run: node src/blog_tracker.js

      - name: Save state
        if: always() && steps.track.outcome != 'cancelled'
        env:
          COMMIT_SOFT_FAIL: '1'
        run: |
          scripts/commit-state.sh "blog-tracker: state" data/blog_tracker.json

      - name: Fail if tracker failed
        if: always() && steps.track.outcome == 'failure'
        run: exit 1
