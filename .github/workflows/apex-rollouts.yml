name: Apex Rollouts %

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-apex-rollouts]

permissions:
  contents: write

# Ne jamais annuler un run en pleine sauvegarde (sinon spam du même % au run suivant)
concurrency:
  group: apex-rollouts
  cancel-in-progress: false

jobs:
  rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: node --check src/apex_rollouts.js

      - name: Track Apex rollout percentages
        id: apex
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_TOKENS: ${{ secrets.DISCORD_USER_TOKENS }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          DISCORD_USER_TOKEN_4: ${{ secrets.DISCORD_USER_TOKEN_4 }}
          DISCORD_USER_TOKEN_5: ${{ secrets.DISCORD_USER_TOKEN_5 }}
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APEX_MIN_PCT_DELTA: "2"
          APEX_RECENT_YEAR: "2025"
          ORBIT_BOT_NAME: Datamining
          ORBIT_AVATAR_URL: ${{ vars.ORBIT_AVATAR_URL || format('https://cdn.jsdelivr.net/gh/{0}@main/media/datamining-avatar.png', github.repository) }}
        run: node src/apex_rollouts.js

      # exit 2 = webhook en échec : l'état a été écrit SANS avancer "announced" → on le sauvegarde quand même
      - name: Save apex state
        if: always() && steps.apex.outcome != 'cancelled'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apex_rollouts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No apex state changes"
            exit 0
          fi
          git commit -m "apex rollouts state"
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            echo "push retry $i"
            sleep $((i * 2))
          done
          if [ "$PUSHED" -ne 1 ]; then
            echo "ERROR: could not push apex state"
            exit 1
          fi

      - name: Fail if tracker failed
        if: always() && steps.apex.outcome == 'failure'
        run: exit 1
