name: User Rollouts %

on:
  schedule:
    - cron: "10,30,50 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-user-rollouts, trigger-apex-rollouts]

permissions:
  contents: write

concurrency:
  group: user-rollouts
  cancel-in-progress: false

jobs:
  user-rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Heal user_rollouts.js if corrupted + ensure hash button
        run: |
          set -euo pipefail
          SZ=$(wc -c < src/user_rollouts.js 2>/dev/null || echo 0)
          NEED=0
          if [ "$SZ" -lt 5000 ]; then NEED=1; fi
          if grep -qE 'PLACEHOLDER|SEE_FILE|^LOADING$' src/user_rollouts.js 2>/dev/null; then NEED=1; fi
          if ! grep -q "userHashButtonRow" src/user_rollouts.js 2>/dev/null; then NEED=1; fi
          if [ "$NEED" = "1" ]; then
            echo "Restoring/patching user_rollouts.js"
            git show 115a4c6f7532be62e9e2a2dcbc72881f6d001ce9:src/user_rollouts.js > src/user_rollouts.js || \
              curl -fsSL "https://raw.githubusercontent.com/kmljkjj/discord-canary-scraper-test/115a4c6f7532be62e9e2a2dcbc72881f6d001ce9/src/user_rollouts.js" -o src/user_rollouts.js
            node <<'NODE'
          const fs = require('fs');
          let c = fs.readFileSync('src/user_rollouts.js', 'utf8');
          if (!c.includes("require('./lib/experiment_hash')")) {
            c = c.replace(
              "const { sendEmbeds } = require('./lib/webhook');",
              "const { sendEmbeds, sendWebhook } = require('./lib/webhook');\nconst { userHashButtonRow } = require('./lib/experiment_hash');"
            );
          }
          const old = `async function postWebhook(embeds) {
  if (!WEBHOOK || !embeds.length) return { ok: false, status: 0, text: 'skip' };
  return sendEmbeds(
    WEBHOOK,
    { username: BOT.slice(0, 80), avatar_url: AVATAR },
    embeds,
    { label: 'user-rollouts' },
  );
}`;
          const neu = `async function postWebhook(embeds, changes) {
  if (!WEBHOOK || !embeds.length) return { ok: false, status: 0, text: 'skip' };
  const byTitle = new Map();
  for (const ch of changes || []) {
    if (ch && ch.kind === 'new' && ch.id && !String(ch.id).startsWith('hash:')) {
      byTitle.set('+ ' + ch.id, ch.id);
    }
  }
  let last = { ok: true, status: 200, text: '' };
  for (const emb of embeds) {
    const body = {
      username: BOT.slice(0, 80),
      avatar_url: AVATAR,
      embeds: [emb],
    };
    const expId = byTitle.get(emb.title);
    if (expId) {
      const row = userHashButtonRow(expId);
      if (row) {
        body.components = [row];
        emb.footer = emb.footer || {};
        emb.footer.text = ((emb.footer.text || '') + ' · bouton = ton hash user').trim();
      }
    }
    const r = await sendWebhook(WEBHOOK, body, { label: 'user-rollouts' });
    last = r;
    if (!r.ok) break;
  }
  return last;
}`;
          if (c.includes(old)) {
            c = c.replace(old, neu);
            c = c.replace(/await postWebhook\(embeds\)/g, 'await postWebhook(embeds, changes)');
          }
          fs.writeFileSync('src/user_rollouts.js', c);
          console.log('user_rollouts patched', c.length);
          NODE
            node --check src/user_rollouts.js
            node --check src/lib/experiment_hash.js
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/user_rollouts.js src/lib/experiment_hash.js public/bucket.html 2>/dev/null || true
            if ! git diff --staged --quiet; then
              git commit -m "feat(user-exp): hash button + restore user_rollouts" || true
              git pull --rebase --autostash origin main || git rebase --abort || true
              git push origin HEAD:main || true
            fi
          else
            echo "user_rollouts.js already OK ($SZ bytes)"
          fi

      - name: Unit tests (rollout math)
        run: node --test test/rollout_math.test.js

      - name: Sample user rollouts
        id: rollouts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_TOKENS: ${{ secrets.DISCORD_USER_TOKENS }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_1: ${{ secrets.DISCORD_USER_TOKEN_1 }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          DISCORD_USER_TOKEN_4: ${{ secrets.DISCORD_USER_TOKEN_4 }}
          DISCORD_USER_TOKEN_5: ${{ secrets.DISCORD_USER_TOKEN_5 }}
          APEX_WEBHOOK_URL: ${{ secrets.APEX_WEBHOOK_URL }}
          ROLLOUT_WEBHOOK_URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_ROLLOUT_SAMPLES: "150"
          USER_ROLLOUT_CONCURRENCY: "2"
          USER_ROLLOUT_DELAY_MS: "300"
          USER_ROLLOUT_MIN_OK: "35"
          USER_ROLLOUT_NOTIFY_HASH: "0"
          APEX_MIN_PCT_DELTA: "1"
          ORBIT_BOT_NAME: Datamining
          ORBIT_AVATAR_URL: ${{ vars.ORBIT_AVATAR_URL || format('https://cdn.jsdelivr.net/gh/{0}@main/media/datamining-avatar.png', github.repository) }}
        run: node src/user_rollouts.js

      - name: Commit state
        if: always() && steps.rollouts.outcome != 'cancelled'
        run: |
          scripts/commit-state.sh "data: user rollouts" data/user_rollouts.json

      - name: Fail if rollouts failed
        if: always() && steps.rollouts.outcome == 'failure'
        run: exit 1
