name: Mobile Versions + Files

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-mobile-versions]

permissions:
  contents: write

concurrency:
  group: mobile-scrape
  cancel-in-progress: false

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Mobile versions
        id: versions
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ORBIT_BOT_NAME: Datamining
          MOBILE_VERSIONS_PAUSED: '1'
        run: node src/mobile_versions.js

      - name: Commit versions state
        if: always() && steps.versions.outcome == 'success'
        run: |
          scripts/commit-state.sh "mobile versions" data/mobile_versions.json

      - name: Mobile experiments from client files
        id: files
        if: always() && steps.versions.outcome != 'cancelled'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MOBILE_DATAMINE_REPO: ${{ secrets.MOBILE_DATAMINE_REPO }}
          ORBIT_BOT_NAME: Datamining
        run: node src/mobile_from_files.js

      - name: Commit files state
        if: always() && steps.files.outcome == 'success'
        run: |
          scripts/commit-state.sh "mobile files: experiments state" data/mobile_experiments.json data/known_mobile_experiment_ids.json

      - name: Fail if versions or files failed
        if: always() && (steps.versions.outcome == 'failure' || steps.files.outcome == 'failure')
        run: |
          echo "versions=${{ steps.versions.outcome }} files=${{ steps.files.outcome }}"
          exit 1
