name: Scrape Discord Canary

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "FATAL: package-lock.json missing — refuse non-reproducible install"
            exit 1
          fi
          npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Scrape + notify + archive chunks
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPE_WEB_ONLY: '1'
          SCRAPE_CSS: '0'
          DOWNLOAD_CONCURRENCY: '24'
          DOWNLOAD_RETRIES: '4'
          ARCHIVE_KEEP_BUILDS: '8'
          ORBIT_BOT_NAME: ${{ secrets.ORBIT_BOT_NAME }}
          ORBIT_AVATAR_URL: ${{ vars.ORBIT_AVATAR_URL || format('https://cdn.jsdelivr.net/gh/{0}@main/media/datamining-avatar.png', github.repository) }}
          EMOJI_ADDED: ${{ secrets.EMOJI_ADDED }}
          EMOJI_MODIFIED: ${{ secrets.EMOJI_MODIFIED }}
          EMOJI_REMOVED: ${{ secrets.EMOJI_REMOVED }}
          EMOJI_BUILD: ${{ secrets.EMOJI_BUILD }}
          EMOJI_EXP: ${{ secrets.EMOJI_EXP }}
          EMOJI_STR: ${{ secrets.EMOJI_STR }}
          EMOJI_ROUTE: ${{ secrets.EMOJI_ROUTE }}
        run: node src/index.js

      - name: Commit baseline + archive
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Whitelist only — never bare `git add -f data/`
          git add -f \
            data/known_experiment_ids.json \
            data/known_string_keys.json \
            data/known_route_keys.json \
            data/last_extract_strings.json \
            data/last_extract_routes.json \
            data/last_extract_experiments.json \
            data/current_experiments.json \
            data/removed_experiments.json \
            data/announced_builds.json \
            data/notify_dedupe.json \
            data/last_run_meta.json \
            data/build.json \
            data/experiments.json \
            data/apex_experiments.json \
            data/findings.json \
            data/strings.json \
            data/routes.json \
            data/meta.json \
            data/generation.json \
            data/cache/ 2>/dev/null || true
          # Archives : src/lib/archive_chunks.js écrit dans builds/ (pas data/builds/).
          # -A pour aussi committer les suppressions des vieux builds (ARCHIVE_KEEP_BUILDS).
          # builds/*/files/ reste ignoré via .gitignore.
          if [ -d builds ]; then
            git add -A -- builds/ 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          BUILD_NUM=$(node -e "try{console.log(require('./data/build.json').buildNumber||'unknown')}catch(e){console.log('unknown')}")
          git commit -m "canary build: ${BUILD_NUM}"
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            echo "push attempt $i failed — retrying"
            sleep 3
          done
          if [ "$PUSHED" -ne 1 ]; then
            echo "ERROR: Could not push baseline after 5 attempts"
            exit 1
          fi
