name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/**/*.js'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Syntax check (tous les .js)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        if: matrix.node != '22'
        run: npm test

      - name: Unit tests + couverture
        if: matrix.node == '22'
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage.txt
          {
            echo '## Couverture des tests'
            echo '```'
            grep -E '^# (file|all files|-)|^# [a-z_/]+\.js' coverage.txt | sed 's/^# //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tests must not modify tracked data/
        run: git diff --exit-code -- data/

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/*.py cogs/*.py
