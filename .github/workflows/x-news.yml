name: X News · DiscordNEW8r

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-x-news]

permissions:
  contents: write

concurrency:
  group: x-posts  # partagé : les deux écrivent data/seen_x_posts.json
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Watch @DiscordNEW8r
        env:
          X_NEWS_WEBHOOK_URL: ${{ secrets.X_NEWS_WEBHOOK_URL }}
          X_WEBHOOK_URL: ${{ secrets.X_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          # Preferred free auth: full browser Cookie header
          X_COOKIE: ${{ secrets.X_COOKIE }}
          X_SCREEN_NAME: DiscordNEW8r
          X_USER_ID: '2073982489836584960'
        run: node src/x_news.js

      - name: Save seen ids
        if: always()
        env:
          COMMIT_SOFT_FAIL: '1'
        run: |
          scripts/commit-state.sh "x-news: seen" data/seen_x_posts.json
